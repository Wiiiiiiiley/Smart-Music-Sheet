name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-credentials:
    runs-on: ubuntu-latest
    name: Check Cloudflare credentials
    steps:
      - name: Check required Actions secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
        run: |
          missing=0
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Missing Actions secret CLOUDFLARE_API_TOKEN. Add it in repository Settings > Secrets and variables > Actions."
            missing=1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Missing Actions secret CLOUDFLARE_ACCOUNT_ID. Add the Cloudflare account ID in repository Settings > Secrets and variables > Actions."
            missing=1
          fi
          if [[ -z "${VITE_API_URL//[[:space:]]/}" ]]; then
            echo "::error::Missing Actions secret VITE_API_URL. Set the production Worker API URL before building the frontend."
            missing=1
          fi
          if [[ -z "${VITE_WS_URL//[[:space:]]/}" ]]; then
            echo "::error::Missing Actions secret VITE_WS_URL. Set the production Worker WebSocket URL before building the frontend."
            missing=1
          fi
          exit "$missing"

  deploy-backend:
    needs: check-credentials
    runs-on: ubuntu-latest
    name: Deploy Backend (Workers)
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_REVISION: ${{ github.sha }}
      API_URL: ${{ secrets.VITE_API_URL }}
      EXPECTED_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        working-directory: ./backend-wrangler
        run: npm ci

      - name: Typecheck Worker
        working-directory: ./backend-wrangler
        run: npm run build

      - name: Test Worker integration
        working-directory: ./backend-wrangler
        run: npm test

      - name: Apply existing D1 migrations
        working-directory: ./backend-wrangler
        run: npx wrangler d1 migrations apply edutempo-db --remote

      - name: Deploy to Workers
        working-directory: ./backend-wrangler
        run: npx wrangler deploy --var "APP_REVISION:$APP_REVISION"

      - name: Verify deployed Worker revision and routes
        run: node backend-wrangler/scripts/verify-deployment.mjs

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    name: Deploy Frontend (Pages)
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build frontend
        run: npm run build:frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
          VITE_REALTIME_TRANSPORT: websocket
        
      - name: Deploy to Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: edutempo
          directory: frontend/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
